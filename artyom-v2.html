<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Артём English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F8FAFC;font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;}
button{cursor:pointer;border:none;transition:transform 0.15s;}
button:active{transform:scale(0.96)!important;}
.syne{font-family:'Syne',sans-serif;}
.screen{display:none;}.screen.active{display:block;}
.locked{opacity:0.45;pointer-events:none;}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ═══════════════════ HOME ═══════════════════ -->
<div id="home" class="screen active">

        </div>
        <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:14px;padding:10px;text-align:center;border:1px solid rgba(16,185,129,0.3);">
          <div style="font-size:16px;">✅</div>
          <div id="stat-words" class="syne" style="font-size:18px;font-weight:800;color:#10B981;">0</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4);">Слов</div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:20px 16px;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#94a3b8;font-weight:700;margin-bottom:2px;">Выбери раздел</div>

    <button onclick="go('words')" style="background:linear-gradient(135deg,#6C63FF12,#6C63FF05);border:1px solid #6C63FF25;border-radius:20px;padding:18px 20px;text-align:left;display:flex;align-items:center;gap:16px;width:100%;">
      <div style="width:50px;height:50px;border-radius:16px;background:#6C63FF18;border:1px solid #6C63FF30;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">📚</div>
      <div><div class="syne" style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:3px;">Слова по темам</div><div style="font-size:12px;color:#64748b;">Футбол · Ф1 · ЛЕГО · Музыка</div></div>
      <div style="margin-left:auto;color:#6C63FF;font-size:22px;">›</div>
    </button>

    <button onclick="go('quiz')" style="background:linear-gradient(135deg,#F59E0B12,#F59E0B05);border:1px solid #F59E0B25;border-radius:20px;padding:18px 20px;text-align:left;display:flex;align-items:center;gap:16px;width:100%;">
      <div style="width:50px;height:50px;border-radius:16px;background:#F59E0B18;border:1px solid #F59E0B30;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">⚡</div>
      <div><div class="syne" style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:3px;">Викторина</div><div style="font-size:12px;color:#64748b;">Тест знаний · Зарабатывай XP</div></div>
      <div style="margin-left:auto;color:#F59E0B;font-size:22px;">›</div>

    <button onclick="go('dialogue')" style="background:linear-gradient(135deg,#10B98112,#10B98105);border:1px solid #10B98125;border-radius:20px;padding:18px 20px;text-align:left;display:flex;align-items:center;gap:16px;width:100%;">

    </div>
  </div>
</div>

<!-- ═══════════════════ ROAD MAP ═══════════════════ -->
<div id="road" class="screen">
  <div style="display:flex;align-items:center;gap:12px;padding:20px 16px 12px;">
    <button onclick="go('home')" style="background:#f1f5f9;border-radius:12px;width:38px;height:38px;font-size:18px;">←</button>
    <span class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;">🗺️ Путь до B2</span>
  </div>
  <div style="padding:0 16px 32px;" id="road-content"></div>
</div>

<!-- ═══════════════════ WORDS ═══════════════════ -->
<div id="words" class="screen">
  <div style="display:flex;align-items:center;gap:12px;padding:20px 16px 12px;">
    <button onclick="go('home')" style="background:#f1f5f9;border-radius:12px;width:38px;height:38px;font-size:18px;">←</button>
    <span class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;">📚 Слова</span>
    <div id="words-level-badge" style="margin-left:auto;border-radius:10px;padding:4px 12px;font-size:12px;font-weight:700;"></div>
  </div>
  <div style="padding:0 16px 32px;">
    <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;" id="pack-tabs"></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
      <span id="word-counter" style="font-size:12px;color:#94a3b8;">Слово 1 из 8</span>
      <span id="pack-label" style="font-size:12px;font-weight:700;"></span>
    </div>
    <div style="background:#f1f5f9;border-radius:8px;height:6px;margin-bottom:18px;overflow:hidden;">
      <div id="word-progress" style="height:100%;border-radius:8px;width:12%;transition:width 0.4s;"></div>
    </div>
    <div id="word-card" onclick="flipCard()" style="border-radius:28px;padding:44px 28px;text-align:center;cursor:pointer;margin-bottom:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 0.4s;">
      <div id="word-emoji" style="font-size:52px;margin-bottom:14px;"></div>
      <div id="word-front">
        <div id="word-text" class="syne" style="font-size:30px;font-weight:800;color:#fff;margin-bottom:8px;"></div>
        <div style="font-size:13px;color:rgba(255,255,255,0.4);">Нажми — узнай перевод</div>
      </div>
      <div id="word-back" style="display:none;">
        <div id="word-translation" class="syne" style="font-size:22px;font-weight:700;color:#fff;margin-bottom:12px;"></div>
        <div id="word-example" style="font-size:13px;color:rgba(255,255,255,0.75);font-style:italic;line-height:1.5;max-width:280px;"></div>
        <div id="word-grammar" style="margin-top:10px;background:rgba(255,255,255,0.15);border-radius:8px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,0.9);"></div>
      </div>
    </div>
    <button id="mem-btn" onclick="markMemorized()" style="width:100%;padding:13px;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;"></button>
    <div style="display:flex;gap:10px;">
      <button onclick="prevWord()" style="flex:1;padding:15px;background:#f1f5f9;border-radius:16px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#475569;">← Назад</button>
      <button id="next-btn" onclick="nextWord()" style="flex:2;padding:15px;border-radius:16px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;">Вперёд →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ QUIZ ═══════════════════ -->
<div id="quiz" class="screen">
  <div style="display:flex;align-items:center;gap:12px;padding:20px 16px 12px;">
    <button onclick="go('home');resetQuiz();" style="background:#f1f5f9;border-radius:12px;width:38px;height:38px;font-size:18px;">←</button>
    <span class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;">⚡ Викторина</span>
    <div id="quiz-xp-badge" style="margin-left:auto;background:#FEF3C7;border-radius:10px;padding:6px 14px;font-family:'Syne',sans-serif;font-weight:800;color:#D97706;font-size:13px;">0 XP</div>
  </div>
  <div style="padding:0 16px 32px;">
    <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;" id="quiz-tabs"></div>
    <div id="quiz-content"></div>
  </div>
</div>

<!-- ═══════════════════ DIALOGUE ═══════════════════ -->
<div id="dialogue" class="screen">
  <div style="display:flex;align-items:center;gap:12px;padding:20px 16px 12px;">
    <button onclick="go('home')" style="background:#f1f5f9;border-radius:12px;width:38px;height:38px;font-size:18px;">←</button>
    <span class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;">💬 Диалоги</span>
  </div>
  <div style="padding:0 16px 32px;">
    <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;" id="dl-tabs"></div>
    <div id="dl-header"></div>
    <div id="dl-lines" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;"></div>
    <div id="dl-btn"></div>
  </div>
</div>

<!-- ═══════════════════ GRAMMAR ═══════════════════ -->
<div id="grammar" class="screen">
  <div style="display:flex;align-items:center;gap:12px;padding:20px 16px 12px;">
    <button onclick="go('home')" style="background:#f1f5f9;border-radius:12px;width:38px;height:38px;font-size:18px;">←</button>
    <span class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;">📖 Грамматика</span>
  </div>
  <div style="padding:0 16px 32px;" id="grammar-content"></div>
</div>

<!-- ═══════════════════ LEVEL UP OVERLAY ═══════════════════ -->
<div id="levelup-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:32px;">
  <div style="font-size:72px;margin-bottom:16px;">🎉</div>
  <div class="syne" style="font-size:32px;font-weight:800;color:#fff;margin-bottom:8px;">Новый уровень!</div>
  <div id="levelup-text" class="syne" style="font-size:48px;font-weight:800;color:#F59E0B;margin-bottom:16px;"></div>
  <div id="levelup-desc" style="font-size:15px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:32px;"></div>
  <button onclick="closeLevelUp()" style="background:linear-gradient(135deg,#6C63FF,#4338ca);border:none;border-radius:20px;padding:18px 40px;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#fff;box-shadow:0 8px 32px rgba(108,99,255,0.5);">Продолжить! 🚀</button>
</div>

<script>
// ═══════════════════ LEVEL SYSTEM ═══════════════════
const LEVELS = [
  {id:"A2",  label:"A2",  xpMin:0,   xpMax:200,  color:"#6C63FF", desc:"Базовые фразы и слова. Ты только начинаешь!"},
  {id:"A2+", label:"A2+", xpMin:200, xpMax:500,  color:"#8B5CF6", desc:"Уверенные простые предложения. Говоришь о себе!"},
  {id:"B1",  label:"B1",  xpMin:500, xpMax:1000, color:"#F59E0B", desc:"Свободные диалоги. Обсуждаешь свои интересы!"},
  {id:"B1+", label:"B1+", xpMin:1000,xpMax:2000, color:"#EF4444", desc:"Сложные тексты, аргументация. Почти у цели!"},
  {id:"B2",  label:"B2",  xpMin:2000,xpMax:2000, color:"#10B981", desc:"🏆 ЦЕЛЬ! Ты готов к собеседованию в гимназию!"},
];

function getCurrentLevel(xp){
  for(let i=LEVELS.length-1;i>=0;i--) if(xp>=LEVELS[i].xpMin) return LEVELS[i];
  return LEVELS[0];
}
function getLevelIndex(xp){
  for(let i=LEVELS.length-1;i>=0;i--) if(xp>=LEVELS[i].xpMin) return i;
  return 0;
}

// ═══════════════════ ALL WORDS BY LEVEL ═══════════════════

    "A2+":[

// ═══════════════════ HELPERS ═══════════════════
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='words'){initWords();}
  if(id==='quiz'){initQuiz();}
  if(id==='dialogue'){initDialogue();}
  if(id==='grammar'){initGrammar();}
  if(id==='road'){renderRoad();}
  if(id==='home'){updateHome();}
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function addXP(n){
  const prevLevel=getLevelIndex(xp);
  xp+=n;
  const newLevel=getLevelIndex(xp);
  updateHome();
  if(newLevel>prevLevel) showLevelUp(LEVELS[newLevel]);
}

function updateHome(){
  const lv=getCurrentLevel(xp);
  const li=getLevelIndex(xp);
  document.getElementById('stat-xp').textContent=xp;
  document.getElementById('stat-words').textContent=memorized.size;
  document.getElementById('stat-streak').textContent=streak;
  document.getElementById('cur-level-label').textContent=lv.label;
  const next=LEVELS[Math.min(li+1,LEVELS.length-1)];
  const pct=li>=LEVELS.length-1?100:Math.round((xp-lv.xpMin)/(next.xpMin-lv.xpMin)*100);
  document.getElementById('level-bar').style.width=pct+'%';
  document.getElementById('level-bar').style.background=`linear-gradient(90deg,${lv.color},${next.color})`;
  document.getElementById('xp-cur').textContent=xp+' XP';
  document.getElementById('xp-max').textContent=(li>=LEVELS.length-1?'MAX':next.xpMin)+' XP';
  document.getElementById('xp-to-next').textContent=li>=LEVELS.length-1?'MAX 🏆':(next.xpMin-xp)+' XP';
  // grammar lock
  const gramUnlocked=getLevelIndex(xp)>=2;
  const gl=document.getElementById('grammar-lock-label');
  const gi=document.getElementById('grammar-lock-icon');
  if(gramUnlocked){
    gl.textContent='Времена · Условные · Пассив';

    document.querySelector('button[onclick="go(\'grammar\')"]').classList.remove('locked');

// ═══════════════════ WORDS ═══════════════════
function getAvailablePackLevels(pid){
  const li=getLevelIndex(xp);
  return LEVELS.slice(0,li+1).map(l=>l.id).filter(lid=>ALL_WORDS[pid][lid]);
}

function initWords(){
  // tabs for packs
  const tabsEl=document.getElementById('pack-tabs');
  tabsEl.innerHTML=Object.keys(ALL_WORDS).map(pid=>{
    const p=ALL_WORDS[pid];
    const active=pid===packId;
    return `<button onclick="setPack('${pid}')" style="flex-shrink:0;background:${active?p.color:'#f1f5f9'};border:none;border-radius:14px;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:${active?'#fff':'#64748b'};">${p.icon} ${p.label}</button>`;
  }).join('');
  renderWord();
}

function setPack(pid){
  packId=pid;wordIdx=0;flipped=false;
  // set default level for this pack
  const avail=getAvailablePackLevels(pid);
  packLevel=avail[avail.length-1];
  document.getElementById('pack-tabs').querySelectorAll('button').forEach((b,i)=>{
    const pid2=Object.keys(ALL_WORDS)[i];
    const p=ALL_WORDS[pid2];
    b.style.background=pid2===packId?p.color:'#f1f5f9';
    b.style.color=pid2===packId?'#fff':'#64748b';
  });
  renderWord();
}

function renderWord(){
  const p=ALL_WORDS[packId];
  const words=p[packLevel]||p['A2'];
  const w=words[Math.min(wordIdx,words.length-1)];
  flipped=false;
  const card=document.getElementById('word-card');
  card.style.background=`linear-gradient(135deg,#1a1a2e,#302b63)`;
  card.style.boxShadow=`0 16px 48px ${p.color}30`;
  document.getElementById('word-emoji').textContent=w.e;
  document.getElementById('word-text').textContent=w.w;
  document.getElementById('word-translation').textContent=w.tr;
  document.getElementById('word-example').textContent=`"${w.ex}"`;
  document.getElementById('word-grammar').textContent=w.gr;
  document.getElementById('word-front').style.display='block';
  document.getElementById('word-back').style.display='none';
  document.getElementById('word-counter').textContent=`Слово ${wordIdx+1} из ${words.length}`;
  document.getElementById('pack-label').textContent=`${p.icon} ${p.label} · ${packLevel}`;
  document.getElementById('pack-label').style.color=p.color;
  document.getElementById('word-progress').style.width=((wordIdx+1)/words.length*100)+'%';
  document.getElementById('word-progress').style.background=p.color;
  document.getElementById('next-btn').style.background=p.color;
  document.getElementById('next-btn').style.boxShadow=`0 8px 24px ${p.color}40`;
  // level badge
  const li=getLevelIndex(xp);
  const lv=getCurrentLevel(xp);
  document.getElementById('words-level-badge').textContent=`Уровень ${packLevel}`;
  document.getElementById('words-level-badge').style.background=`${lv.color}20`;
  document.getElementById('words-level-badge').style.color=lv.color;
  // level selector buttons (inline row)
  const avail=getAvailablePackLevels(packId);
  // mem btn
  const key=`${packId}-${packLevel}-${wordIdx}`;
  const mem=memorized.has(key);
  const mb=document.getElementById('mem-btn');
  mb.textContent=mem?'✅ Выучено! +15 XP':'☐ Запомнил';
  mb.style.background=mem?`${p.color}15`:'#f8fafc';
  mb.style.border=`1.5px solid ${mem?p.color:'#e2e8f0'}`;
  mb.style.color=mem?p.color:'#64748b';
}

function flipCard(){
  flipped=!flipped;
  const p=ALL_WORDS[packId];
  if(flipped){
    document.getElementById('word-card').style.background=`linear-gradient(135deg,${p.color},${p.color}bb)`;
    document.getElementById('word-front').style.display='none';
    document.getElementById('word-back').style.display='block';
    addXP(5);
  } else {
    document.getElementById('word-card').style.background=`linear-gradient(135deg,#1a1a2e,#302b63)`;
    document.getElementById('word-front').style.display='block';
    document.getElementById('word-back').style.display='none';
  }
}

function markMemorized(){
  const key=`${packId}-${packLevel}-${wordIdx}`;
  if(!memorized.has(key)){memorized.add(key);addXP(15);toast('+15 XP! Отлично!');}
  renderWord();
}
function nextWord(){
  const words=ALL_WORDS[packId][packLevel]||ALL_WORDS[packId]['A2'];
  if(wordIdx<words.length-1){wordIdx++;addXP(3);}
  else {
    // try to go to next level
    const avail=getAvailablePackLevels(packId);
    const ci=avail.indexOf(packLevel);
    if(ci<avail.length-1){packLevel=avail[ci+1];wordIdx=0;toast('🎉 Следующий уровень слов!');}
    else toast('✅ Все слова этого уровня пройдены!');
  }
  renderWord();
}
function prevWord(){if(wordIdx>0)wordIdx--;renderWord();}

  quizLevelId=LEVELS[Math.min(li,LEVELS.length-1)].id;

function setQuizLevel(id){
  quizLevelId=id;resetQuiz();
  document.querySelectorAll('[id^="qtab-"]').forEach(b=>{
    const lvId=b.id.replace('qtab-','');
    const lv=LEVELS.find(l=>l.id===lvId);
    b.style.background=lvId===quizLevelId?lv.color:'#f1f5f9';
    b.style.color=lvId===quizLevelId?'#fff':'#64748b';
  });
}
function resetQuiz(){qIdx=0;qScore=0;qSel=null;qDone=false;renderQuiz();}
function handleAnswer(i){
  if(qSel!==null)return;

  if(i===qs[qIdx].c){qScore++;addXP(30);document.getElementById('quiz-xp-badge').textContent=qScore*30+' XP';}

  setTimeout(()=>{
    if(qIdx+1>=qs.length){qDone=true;}
    else{qIdx++;qSel=null;}
    renderQuiz();
  },900);
}
function renderQuiz(){
  const el=document.getElementById('quiz-content');

    </div>`;

  }
  const q=qs[qIdx];
  el.innerHTML=`

      <div style="height:100%;border-radius:8px;background:${lv.color};width:${(qIdx/qs.length*100)}%;transition:width 0.4s;"></div>
    </div>
    <div style="background:linear-gradient(135deg,#1a1a2e,#302b63);border-radius:24px;padding:28px 22px;margin-bottom:20px;text-align:center;">
      <div style="font-size:40px;margin-bottom:12px;">${q.e}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;">Уровень ${lv.label} · ${qIdx+1}/${qs.length}</div>
      <div class="syne" style="font-size:18px;font-weight:700;color:#fff;line-height:1.4;">${q.q}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${q.opts.map((o,i)=>{
        let bg='#fff',border='#e2e8f0',col='#1a1a2e';
        if(qSel!==null){if(i===q.c){bg='#ECFDF5';border='#10B981';col='#065f46';}else if(i===qSel){bg='#FEF2F2';border='#EF4444';col='#991b1b';}}
        return `<button onclick="handleAnswer(${i})" style="background:${bg};border:2px solid ${border};border-radius:14px;padding:15px 18px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:${col};text-align:left;display:flex;align-items:center;gap:12px;">

  // tabs
  document.getElementById('dl-tabs').innerHTML=DIALOGUES.map(d=>{
    const locked=getLevelIndex(xp)<LEVELS.findIndex(l=>l.id===d.minLevel);
    return `<button onclick="${locked?'toast(\'🔒 Открывается на уровне '+d.level+'!\')':'setDl(\''+d.id+'\')'}" style="flex-shrink:0;background:${dlId===d.id?d.color:'#f1f5f9'};border:none;border-radius:14px;padding:10px 14px;font-family:\'DM Sans\',sans-serif;font-size:12px;font-weight:600;color:${dlId===d.id?'#fff':'#64748b'};opacity:${locked?0.4:1};">${d.icon} ${d.title}${locked?' 🔒':''}</button>`;
  }).join('');
  renderDialogue();
}
function setDl(id){dlId=id;dlLine=0;showRu=false;renderDialogue();}
function renderDialogue(){
  const d=DIALOGUES.find(x=>x.id===dlId);
  document.getElementById('dl-header').innerHTML=`
    <div style="background:${d.color}15;border:1px solid ${d.color}30;border-radius:20px;padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px;">
      <div style="font-size:32px;">${d.icon}</div>
      <div style="flex:1;">
        <div class="syne" style="font-size:16px;font-weight:800;color:#1a1a2e;">${d.title}</div>
        <div style="font-size:12px;color:#64748b;">${d.ctx}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
        <div style="background:${d.color}20;color:${d.color};border-radius:8px;padding:2px 10px;font-size:11px;font-weight:700;">${d.level}</div>
        <button onclick="showRu=!showRu;renderDialogue();" style="background:${showRu?d.color:'#f1f5f9'};border:none;border-radius:8px;padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:${showRu?'#fff':'#64748b'};">🇷🇺</button>
      </div>
    </div>`;
  document.getElementById('dl-lines').innerHTML=d.lines.slice(0,dlLine+1).map(l=>`
    <div style="display:flex;flex-direction:${l.left?'row':'row-reverse'};gap:10px;align-items:flex-end;">
      <div style="width:34px;height:34px;border-radius:50%;background:${l.left?d.color+'25':'#f1f5f9'};border:2px solid ${l.left?d.color:'#e2e8f0'};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">${l.left?'🧒':'👤'}</div>
      <div style="max-width:74%;">
        <div style="font-size:10px;color:#94a3b8;margin-bottom:3px;text-align:${l.left?'left':'right'};">${l.sp}</div>
        <div style="background:${l.left?d.color+'12':'#f8fafc'};border:1px solid ${l.left?d.color+'25':'#e2e8f0'};border-radius:${l.left?'4px 18px 18px 18px':'18px 4px 18px 18px'};padding:11px 14px;">
          <div style="font-size:14px;color:#1a1a2e;line-height:1.5;margin-bottom:${showRu?'6px':'0'};">${l.txt}</div>
          ${showRu?`<div style="font-size:12px;color:#94a3b8;font-style:italic;border-top:1px dashed #e2e8f0;padding-top:6px;">${l.ru}</div>`:''}
        </div>
      </div>
    </div>`).join('');
  const btn=document.getElementById('dl-btn');
  if(dlLine<d.lines.length-1){
    btn.innerHTML=`<button onclick="dlLine++;addXP(10);renderDialogue();" style="width:100%;padding:15px;background:${d.color};border:none;border-radius:16px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;box-shadow:0 8px 24px ${d.color}40;">Следующая реплика →</button>`;
  } else {
    btn.innerHTML=`<div style="text-align:center;padding:16px 0;">
      <div style="font-size:48px;margin-bottom:10px;">🎉</div>
      <div class="syne" style="font-size:20px;font-weight:800;color:#1a1a2e;margin-bottom:6px;">Молодец, Артём!</div>
      <div style="color:#64748b;font-size:13px;margin-bottom:20px;">+${d.lines.length*10} XP заработано</div>
      <button onclick="dlLine=0;showRu=false;renderDialogue();" style="background:#f1f5f9;border:none;border-radius:14px;padding:14px 32px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#475569;">Читать снова</button>
    </div>`;
  }
}

// ═══════════════════ GRAMMAR ═══════════════════
function initGrammar(){
  const li=getLevelIndex(xp);
  if(li<2){go('home');toast('🔒 Открывается на B1 (500 XP)!');return;}
  renderGrammar();
}
function renderGrammar(){
  const available=GRAMMAR.filter(g=>getLevelIndex(xp)>=LEVELS.findIndex(l=>l.id===g.level));
  const g=available[grammarIdx]||available[0];
  if(!g){document.getElementById('grammar-content').innerHTML='<p>Нет доступных тем.</p>';return;}
  document.getElementById('grammar-content').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;">
      ${available.map((gr,i)=>`<button onclick="grammarIdx=${i};grammarAnswered=false;renderGrammar();" style="flex-shrink:0;background:${i===grammarIdx?gr.color:'#f1f5f9'};border:none;border-radius:12px;padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:${i===grammarIdx?'#fff':'#64748b'};">${gr.icon} ${gr.title}</button>`).join('')}
    </div>
    <div style="background:linear-gradient(135deg,#0f0c29,#302b63);border-radius:24px;padding:24px;margin-bottom:16px;">
      <div style="font-size:32px;margin-bottom:12px;">${g.icon}</div>
      <div class="syne" style="font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;">${g.title}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6);">Уровень ${g.level}</div>
    </div>
    <div style="background:${g.color}12;border:1px solid ${g.color}30;border-radius:20px;padding:20px;margin-bottom:16px;">
      <div class="syne" style="font-size:14px;font-weight:800;color:#1a1a2e;margin-bottom:12px;">📌 Правило</div>
      <div style="font-size:14px;color:#475569;line-height:1.6;">${g.rule}</div>
    </div>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;padding:20px;margin-bottom:16px;">
      <div class="syne" style="font-size:14px;font-weight:800;color:#1a1a2e;margin-bottom:12px;">💡 Примеры</div>
      ${g.examples.map(ex=>`<div style="font-size:13px;color:#475569;margin-bottom:8px;padding-left:12px;border-left:3px solid ${g.color};line-height:1.5;">${ex}</div>`).join('')}
    </div>
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px;">
      <div class="syne" style="font-size:14px;font-weight:800;color:#1a1a2e;margin-bottom:16px;">✏️ Упражнение</div>
      <div style="font-size:15px;color:#1a1a2e;margin-bottom:16px;line-height:1.5;">${g.exercise.q}</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${g.exercise.opts.map((o,i)=>{
          let bg='#f8fafc',border='#e2e8f0',col='#1a1a2e';
          if(grammarAnswered){if(i===g.exercise.c){bg='#ECFDF5';border='#10B981';col='#065f46';}else{bg='#fafafa';col='#94a3b8';}}
          return `<button onclick="if(!grammarAnswered){grammarAnswered=true;${i===g.exercise.c?`addXP(20);toast('+20 XP! Правильно! 🎉')`:`toast('Неправильно. Правильный ответ: ${o.replace("'","\\'")} — см. правило!')`};renderGrammar();}" style="background:${bg};border:2px solid ${border};border-radius:12px;padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:${col};text-align:left;display:flex;gap:10px;align-items:center;">
            <span style="width:26px;height:26px;border-radius:7px;background:${grammarAnswered&&i===g.exercise.c?'#10B981':'#f1f5f9'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:${grammarAnswered&&i===g.exercise.c?'#fff':'#94a3b8'};flex-shrink:0;">${String.fromCharCode(65+i)}</span>${o}
          </button>`;
        }).join('')}
      </div>
    </div>`;
}

// ═══════════════════ INIT ═══════════════════
try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.ready();}catch(e){}
updateHome();
</script>
